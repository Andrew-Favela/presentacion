<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Soluciones para tu Negocio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    img {
      width: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 40px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 400px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      transition: 0.3s;
      border: 1px solid #334155;
    }

    .card:hover {
      transform: scale(1.05);
      border-color: #22c55e;
    }

    .card h2 {
      margin: 10px 0;
    }

    .erp {
      border-left: 5px solid #3b82f6;
    }

    .marketing {
      border-left: 5px solid #22c55e;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8em;
      color: #64748b;
    }

  </style>
</head>
<body>

  <div class="container">

    <!-- LOGO -->
    <img src="Logo.png" alt="Logo">

    <h1>¿Qué necesitas hoy?</h1>
    <p>Selecciona la solución ideal para hacer crecer tu negocio</p>

    <div class="options">

      <!-- ERP -->
      <a href="https://andrew-favela.github.io/ERP/" class="card erp">
        <h2>💼 Sistema ERP</h2>
        <p>Administra tu negocio, controla ventas y automatiza procesos</p>
      </a>

      <!-- MARKETING -->
      <a href="https://andrew-favela.github.io/CLIENTEO/" class="card marketing">
        <h2>🚀 Agencia de Marketing</h2>
        <p>Consigue más clientes y aumenta tus ventas</p>
      </a>

    </div>

    <footer>
      © 2026 - Soluciones Empresariales
    </footer>

  </div>

</body>
</html>
